<!doctype html>
<html lang="fr">
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover"
        />
        <meta name="referrer" content="same-origin" />
        <meta
            name="description"
            content="SunTrail 3D — Carte topographique 3D interactive pour la randonnée. Terrain réaliste, GPS, météo, analyse solaire et tracés GPX."
        />
        <meta name="mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta
            name="apple-mobile-web-app-status-bar-style"
            content="black-translucent"
        />
        <meta name="apple-mobile-web-app-title" content="SunTrail 3D" />
        <title>SunTrail - Moteur Three.js</title>

        <!-- OAuth token initialization — doit être AVANT main.ts -->
        <script>
            (async function () {
                const hash = localStorage.getItem('__oauth_hash');
                if (hash) {
                    try {
                        // Importer Supabase et établir la session
                        const { createClient } =
                            await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.38.0/+esm');
                        const supabase = createClient(
                            'https://esennvviieylqhbleqdv.supabase.co',
                            'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVzZW5udnZpaWV5bHFoYmxlcWR2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3MDk3NDk1MjIsImV4cCI6MjAyNTMyOTUyMn0.tH5TGLx7iMEKK9sOaEu8WPpE7OKzPVxqwYpLNLmJpDc'
                        );

                        const params = new URLSearchParams(hash);
                        const accessToken = params.get('access_token');
                        const refreshToken = params.get('refresh_token');

                        if (accessToken && refreshToken) {
                            await supabase.auth.setSession({
                                access_token: accessToken,
                                refresh_token: refreshToken,
                            });
                            localStorage.removeItem('__oauth_hash');
                        }
                    } catch (e) {
                        console.error('[OAuth] Setup failed:', e);
                    }
                }
            })();
        </script>

        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap"
        />
        <link rel="manifest" href="./manifest.webmanifest" />
    </head>
    <body id="body">
        <a
            href="#canvas-container"
            class="skip-link"
            data-i18n="a11y.skipToContent"
            >Aller au contenu</a
        >
        <h1 class="sr-only">SunTrail - Carte 3D</h1>

        <!-- Indicateur de chargement des tuiles réseau -->
        <div id="tile-loading-bar" aria-hidden="true"></div>

        <!-- Overlay de chargement de la carte — bloqué tant que le moteur n'est pas prêt -->
        <div id="map-loading-overlay" class="visible">
            <span class="spinner map-loading-spinner"></span>
            <span class="map-loading-text" data-i18n="loading.map"
                >Chargement de la carte...</span
            >
            <div id="map-loading-offline-msg" style="display: none">
                <span data-i18n="network.overlay.title">Pas de connexion</span>
                <span
                    class="map-loading-offline-sub"
                    data-i18n="network.overlay.subtitle"
                    >La carte sera chargée depuis le cache si disponible</span
                >
            </div>
            <button
                id="map-loading-retry"
                style="
                    display: none;
                    margin-top: var(--space-4);
                    padding: 10px 24px;
                    border-radius: var(--radius-md);
                    background: var(--accent-btn);
                    color: var(--on-accent);
                    border: none;
                    font-weight: 700;
                    cursor: pointer;
                "
            >
                Réessayer
            </button>
        </div>

        <main>
            <div id="canvas-container">
                <!-- Le canvas sera injecté ici par initScene() -->
            </div>
        </main>

        <header>
            <div id="top-status-bar"></div>
        </header>

        <!-- Résumé compact Préparer : visible uniquement sur petits écrans. -->
        <div
            id="route-plan-hud"
            role="status"
            aria-live="polite"
            aria-atomic="true"
        >
            <div class="rph-context" id="rph-context"></div>
            <div class="rph-stats" id="rph-stats" hidden>
                <span class="rph-stat" id="rph-distance"></span>
                <span class="rph-stat" id="rph-ascent"></span>
                <span class="rph-stat" id="rph-descent"></span>
                <span class="rph-stat" id="rph-duration"></span>
            </div>
        </div>

        <!-- COORDS PILL -->
        <div id="coords-pill" class="hidden">
            <div class="coords-lat" id="click-latlon">—</div>
            <div class="coords-alt" id="click-alt">—</div>
            <div
                class="coords-poi"
                id="click-poi-name"
                style="display: none"
            ></div>
            <div class="coords-actions">
                <button
                    class="coords-btn solar"
                    id="probe-btn"
                    data-i18n="coords.solar"
                >
                    ☀️ Solaire
                </button>
                <button
                    class="coords-btn sos"
                    id="sos-btn-pill"
                    style="display: none"
                >
                    SOS
                </button>
            </div>
        </div>

        <div id="zoom-indicator" style="display: none">Détail --</div>

        <nav id="nav-bar"></nav>

        <div id="sheet-overlay"></div>
        <div id="sheet-container"></div>
        <div id="toast-container"></div>

        <!-- ROUTE BAR — mini-panneau persistant planificateur d'itinéraire -->
        <div
            id="route-bar"
            role="region"
            aria-label="Planificateur d'itinéraire"
            data-i18n-aria-label="planning.aria.region"
        >
            <div class="rb-dots" id="rb-dots" aria-hidden="true"></div>
            <div class="rb-info" id="rb-info" aria-live="polite"></div>
            <button
                class="rb-btn"
                id="rb-settings-btn"
                aria-label="Réglages de l'itinéraire"
                data-i18n-aria-label="planning.aria.settings"
            >
                ⚙
            </button>
            <button
                class="rb-btn rb-save-btn"
                id="rb-save-btn"
                aria-label="Sauvegarder l’itinéraire"
                data-i18n-aria-label="preparedRoutes.actions.save"
                disabled
            >
                <svg
                    width="16"
                    height="16"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    aria-hidden="true"
                >
                    <path d="M5 3h12l2 2v16H5z" />
                    <path d="M8 3v6h8V3" />
                    <path d="M8 21v-7h8v7" />
                </svg>
            </button>
            <button
                class="rb-btn rb-guidance-btn"
                id="rb-guidance-btn"
                aria-label="Suivre cet itinéraire"
                data-i18n-aria-label="guidance.actions.start"
                disabled
                hidden
            >
                <svg
                    width="18"
                    height="18"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    aria-hidden="true"
                >
                    <circle cx="4" cy="19" r="1.5" />
                    <path d="M5.5 19c6 0 3-14 11-14h3" />
                    <path d="m16 2 4 3-4 3" />
                </svg>
            </button>
            <button
                class="rb-btn"
                id="rb-reverse-btn"
                aria-label="Inverser le départ et l'arrivée"
                data-i18n-aria-label="planning.aria.reverse"
            >
                ⇄
            </button>
            <button
                class="rb-btn rb-btn-danger"
                id="rb-clear-btn"
                aria-label="Effacer l'itinéraire"
                data-i18n-aria-label="planning.aria.clear"
            >
                <svg
                    width="16"
                    height="16"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    aria-hidden="true"
                >
                    <line x1="18" y1="6" x2="6" y2="18" />
                    <line x1="6" y1="6" x2="18" y2="18" />
                </svg>
            </button>
        </div>

        <!-- Panel réglages itinéraire (profil · boucle · clé ORS · waypoints) -->
        <div
            id="route-settings"
            class="route-settings-panel hidden"
            role="dialog"
            aria-modal="false"
            aria-label="Réglages itinéraire"
            data-i18n-aria-label="planning.aria.settingsDialog"
        >
            <!-- Profil + boucle sur la même ligne -->
            <div class="rs-row">
                <select id="rs-profile" class="rs-profile-select">
                    <option
                        value="foot-hiking"
                        data-i18n="planning.profile.hiking"
                    >
                        Randonnée
                    </option>
                    <option
                        value="foot-walking"
                        data-i18n="planning.profile.walking"
                    >
                        Marche
                    </option>
                    <option
                        value="cycling-regular"
                        data-i18n="planning.profile.cycling"
                    >
                        Vélo
                    </option>
                    <option
                        value="cycling-mountain"
                        data-i18n="planning.profile.mountainBike"
                    >
                        VTT
                    </option>
                </select>
                <input type="checkbox" id="rs-loop" class="rs-hidden-check" />
                <label
                    class="rs-loop-btn"
                    for="rs-loop"
                    data-i18n="planning.loop"
                    >Boucle</label
                >
            </div>
            <div
                class="rs-draft-status"
                id="rs-draft-status"
                aria-live="polite"
            ></div>
            <label
                class="rs-field-label"
                for="rs-route-name"
                data-i18n="preparedRoutes.editor.name"
                >Nom de la route</label
            >
            <input
                id="rs-route-name"
                class="rs-text-input"
                type="text"
                maxlength="120"
                autocomplete="off"
            />
            <div class="rs-search-grid">
                <div class="rs-search-field">
                    <label
                        for="rs-start-search"
                        data-i18n="preparedRoutes.editor.start"
                        >Départ A</label
                    >
                    <input
                        id="rs-start-search"
                        class="rs-text-input"
                        type="search"
                        autocomplete="off"
                    />
                    <div
                        id="rs-start-results"
                        class="rs-search-results"
                        role="listbox"
                    ></div>
                </div>
                <div class="rs-search-field">
                    <label
                        for="rs-end-search"
                        data-i18n="preparedRoutes.editor.end"
                        >Arrivée B</label
                    >
                    <input
                        id="rs-end-search"
                        class="rs-text-input"
                        type="search"
                        autocomplete="off"
                    />
                    <div
                        id="rs-end-results"
                        class="rs-search-results"
                        role="listbox"
                    ></div>
                </div>
            </div>
            <div class="rs-row rs-plan-fields">
                <label
                    for="rs-planned-start"
                    data-i18n="preparedRoutes.editor.plannedStart"
                    >Départ prévu</label
                >
                <input id="rs-planned-start" type="datetime-local" />
                <label for="rs-pace" data-i18n="preparedRoutes.editor.pace"
                    >Allure km/h</label
                >
                <input
                    id="rs-pace"
                    type="number"
                    min="1"
                    max="12"
                    step="0.1"
                    value="4"
                />
            </div>
            <div
                id="rs-route-summary"
                class="rs-route-summary"
                aria-live="polite"
            ></div>
            <details class="rs-route-details">
                <summary data-i18n="preparedRoutes.editor.details">
                    Détails
                </summary>
                <label
                    for="rs-route-notes"
                    data-i18n="preparedRoutes.editor.notes"
                    >Notes</label
                >
                <textarea id="rs-route-notes" rows="2"></textarea>
                <label
                    for="rs-route-tags"
                    data-i18n="preparedRoutes.editor.tags"
                    >Tags séparés par des virgules</label
                >
                <input id="rs-route-tags" class="rs-text-input" type="text" />
            </details>
            <div class="rs-row rs-editor-actions">
                <button
                    id="rs-undo-btn"
                    type="button"
                    data-i18n="preparedRoutes.actions.undo"
                    disabled
                >
                    Annuler
                </button>
                <button
                    id="rs-redo-btn"
                    type="button"
                    data-i18n="preparedRoutes.actions.redo"
                    disabled
                >
                    Rétablir
                </button>
                <button id="rs-favorite-btn" type="button" aria-pressed="false">
                    ☆
                </button>
                <button
                    id="rs-save-btn"
                    type="button"
                    class="btn-primary"
                    data-i18n="preparedRoutes.actions.save"
                    disabled
                >
                    Sauvegarder
                </button>
            </div>
            <!-- Liste des waypoints -->
            <div id="rs-waypoints-list" class="rs-waypoints-list"></div>
        </div>

        <!-- Indicateur visuel long-press -->
        <div id="lp-indicator" aria-hidden="true">
            <svg viewBox="0 0 44 44" xmlns="http://www.w3.org/2000/svg">
                <circle
                    cx="22"
                    cy="22"
                    r="18"
                    fill="none"
                    stroke="var(--accent, #f97316)"
                    stroke-width="3"
                    stroke-dasharray="113"
                    stroke-dashoffset="113"
                    id="lp-circle"
                />
            </svg>
        </div>

        <!-- PILE DE BOUTONS FLOTTANTS -->
        <div class="fab-stack">
            <!-- BOUSSOLE -->
            <button
                type="button"
                id="compass-fab"
                class="fab-btn"
                aria-label="Réinitialiser le Nord"
                data-i18n-aria-label="a11y.resetNorth"
            >
                <svg
                    width="24"
                    height="24"
                    viewBox="0 0 24 24"
                    fill="none"
                    id="compass-svg"
                >
                    <path
                        d="M12 2L15 12L12 22L9 12L12 2Z"
                        fill="#ef4444"
                        stroke="#ef4444"
                        stroke-width="1"
                    />
                    <path d="M12 2L15 12H9L12 2Z" fill="#ef4444" />
                    <circle cx="12" cy="12" r="1" fill="white" />
                </svg>
            </button>

            <!-- POSITION -->
            <button
                type="button"
                id="gps-main-btn"
                class="fab-btn"
                aria-label="Ma position"
                data-i18n-aria-label="a11y.locateMe"
            >
                <svg
                    width="24"
                    height="24"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                >
                    <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z" />
                    <circle cx="12" cy="10" r="3" />
                </svg>
            </button>

            <!-- COUCHES -->
            <button
                type="button"
                id="layers-fab"
                class="fab-btn"
                aria-label="Fonds de carte"
                data-i18n-aria-label="a11y.changeMapType"
            >
                <svg
                    width="24"
                    height="24"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                >
                    <polygon points="12 2 2 7 12 12 22 7 12 2" />
                    <polyline points="2 17 12 22 22 17" />
                    <polyline points="2 12 12 17 22 12" />
                </svg>
            </button>

            <!-- MODE 2D/3D -->
            <button
                class="fab-btn nav-mode-toggle"
                id="nav-2d-toggle"
                aria-label="Basculer 2D/3D"
                data-i18n-aria-label="a11y.toggle2d3d"
                aria-pressed="false"
                style="flex-direction: column; gap: 1px; padding: 2px"
            >
                <svg
                    class="mode-icon mode-icon-3d"
                    width="18"
                    height="18"
                    viewBox="0 0 24 24"
                    fill="none"
                    style="flex-shrink: 0"
                >
                    <path
                        d="M12 3L20 7.5L12 12L4 7.5L12 3Z"
                        fill="currentColor"
                        opacity="0.15"
                        stroke="currentColor"
                        stroke-width="1.5"
                        stroke-linejoin="round"
                    />
                    <path
                        d="M4 7.5V16.5L12 21"
                        fill="currentColor"
                        opacity="0.05"
                        stroke="currentColor"
                        stroke-width="1.5"
                        stroke-linejoin="round"
                    />
                    <path
                        d="M20 7.5V16.5L12 21"
                        fill="currentColor"
                        opacity="0.1"
                        stroke="currentColor"
                        stroke-width="1.5"
                        stroke-linejoin="round"
                    />
                    <line
                        x1="12"
                        y1="12"
                        x2="12"
                        y2="21"
                        stroke="currentColor"
                        stroke-width="1.5"
                    />
                </svg>
                <svg
                    class="mode-icon mode-icon-2d"
                    width="18"
                    height="18"
                    viewBox="0 0 24 24"
                    fill="none"
                    style="flex-shrink: 0"
                >
                    <rect
                        x="4"
                        y="4"
                        width="16"
                        height="16"
                        rx="2.5"
                        stroke="currentColor"
                        stroke-width="1.5"
                    />
                    <line
                        x1="4"
                        y1="10"
                        x2="20"
                        y2="10"
                        stroke="currentColor"
                        stroke-width="1"
                        opacity="0.35"
                    />
                    <line
                        x1="4"
                        y1="16"
                        x2="20"
                        y2="16"
                        stroke="currentColor"
                        stroke-width="1"
                        opacity="0.35"
                    />
                    <line
                        x1="10"
                        y1="4"
                        x2="10"
                        y2="20"
                        stroke="currentColor"
                        stroke-width="1"
                        opacity="0.35"
                    />
                    <line
                        x1="16"
                        y1="4"
                        x2="16"
                        y2="20"
                        stroke="currentColor"
                        stroke-width="1"
                        opacity="0.35"
                    />
                </svg>
                <span
                    class="nav-mode-label"
                    style="
                        font-size: 9px;
                        font-weight: 600;
                        line-height: 1;
                        margin-top: 1px;
                    "
                    >3D</span
                >
            </button>

            <!-- TIMELINE SOLAIRE — disponible uniquement lorsque la carte est en 3D -->
            <button
                type="button"
                class="fab-btn timeline-toggle-fab"
                id="timeline-toggle-btn"
                aria-label="Ouvrir la timeline de simulation"
            >
                <svg
                    width="22"
                    height="22"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    aria-hidden="true"
                >
                    <circle cx="12" cy="12" r="8.5" />
                    <path d="M12 7.5v5l3.25 2" />
                </svg>
            </button>
        </div>

        <!-- Widgets conteneur (Timebar, Profil) -->
        <div id="widgets-container"></div>

        <script type="module" src="/src/main.ts"></script>
    </body>
</html>
