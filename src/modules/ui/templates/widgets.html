<div id="widgets-inner-container">
    <div id="bottom-stack">
        <section
            id="bottom-bar"
            aria-label="Simulation solaire"
            data-i18n-aria-label="timeline.title"
        >
            <div class="timeline-summary-row">
                <time id="time-disp" class="timeline-time">12:00</time>
                <span
                    id="sun-phase"
                    class="timeline-phase"
                    data-phase="day"
                    data-i18n="solar.phase.day"
                    >Plein jour</span
                >
                <input
                    type="date"
                    id="date-input"
                    class="timeline-date-input"
                    aria-label="Date de simulation"
                    data-i18n-aria-label="timeline.date"
                />
            </div>
            <div class="timeline-control-row">
                <button
                    id="play-btn"
                    class="timeline-play-button"
                    type="button"
                    aria-label="Lire la simulation solaire"
                    data-i18n-aria-label="timeline.play"
                ></button>
                <input
                    type="range"
                    id="time-slider"
                    class="timeline-slider"
                    min="0"
                    max="1439"
                    value="720"
                    aria-label="Heure de simulation"
                    data-i18n-aria-label="timeline.time"
                />
                <select
                    id="speed-select"
                    class="timeline-speed-select"
                    aria-label="Vitesse de simulation"
                    data-i18n-aria-label="timeline.speed"
                >
                    <option value="1">1×</option>
                    <option value="5">5×</option>
                    <option value="10">10×</option>
                </select>
            </div>
            <div
                id="timeline-solar-info"
                class="timeline-solar-info"
                aria-live="polite"
                hidden
            >
                <span class="timeline-solar-metric">
                    <span data-i18n="solar.stat.azimuth">Azimut</span>
                    <strong id="tl-azimuth">—</strong>
                </span>
                <span class="timeline-solar-metric">
                    <span data-i18n="solar.stat.elevation">Élévation</span>
                    <strong id="tl-elevation">—</strong>
                </span>
            </div>
        </section>
    </div>
    <div id="elevation-profile" class="prepare-work-surface">
        <div class="profile-header">
            <div class="profile-header-content">
                <h3 class="profile-title" data-i18n="profile.title">Profil</h3>
                <div class="profile-header-actions">
                    <button
                        id="profile-solar-btn"
                        class="profile-solar-btn"
                        data-i18n="profile.analysis"
                        hidden
                    >
                        Analyse solaire
                    </button>
                    <button
                        id="profile-expand-btn"
                        class="profile-expand-btn"
                        aria-label="Agrandir le profil"
                        data-i18n-aria-label="profile.expand"
                    ></button>
                    <button
                        id="close-profile"
                        class="profile-close-btn"
                        aria-label="Fermer"
                        data-i18n-aria-label="common.close"
                    >
                        <svg
                            width="20"
                            height="20"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            aria-hidden="true"
                        >
                            <line x1="18" y1="6" x2="6" y2="18" />
                            <line x1="6" y1="6" x2="18" y2="18" />
                        </svg>
                    </button>
                </div>
            </div>
            <div class="profile-info-row">
                <div id="profile-info" class="profile-info-text">
                    Distance : 0km | Alt : 0m | Pente : 0%
                </div>
            </div>
        </div>
        <div id="profile-chart-container">
            <svg id="profile-svg"></svg>
            <div id="profile-cursor" class="profile-cursor" hidden></div>
        </div>
        <div id="profile-legend" class="profile-legend" hidden>
            <div class="legend-group">
                <span class="legend-group-label" data-i18n="profile.slopes"
                    >Pentes</span
                >
                <span class="legend-item">
                    <span
                        class="legend-scale legend-scale--slope"
                        title="0 / 3 / 6 / 9 / 12 %"
                    ></span
                    ><span>0 / 3 / 6 / 9 / 12 %</span>
                </span>
            </div>
            <div id="solar-legend" class="legend-group" hidden>
                <span class="legend-group-label" data-i18n="profile.solar"
                    >Solaire</span
                >
                <span class="legend-item">
                    <span class="legend-swatch legend-swatch--sun"></span
                    ><span data-i18n="profile.sun">Soleil</span>
                </span>
                <span class="legend-item">
                    <span class="legend-swatch legend-swatch--shade"></span
                    ><span data-i18n="profile.shade">Ombre relief</span>
                </span>
                <span class="legend-item">
                    <span class="legend-swatch legend-swatch--forest"></span
                    ><span data-i18n="profile.forest">Forêt</span>
                </span>
                <span class="legend-item">
                    <span class="legend-swatch legend-swatch--night"></span
                    ><span data-i18n="profile.night">Nuit</span>
                </span>
                <span id="solar-legend-unknown" class="legend-item" hidden>
                    <span class="legend-swatch legend-swatch--unknown"></span
                    ><span data-i18n="profile.unknownShade"
                        >Ombre inconnue</span
                    >
                </span>
            </div>
        </div>
    </div>
</div>
