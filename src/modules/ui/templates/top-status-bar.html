<div class="top-status-bar-content" id="top-status-bar-content">
    <div class="top-left-widgets">
        <button
            type="button"
            class="top-control top-control-pill"
            id="top-pill-weather"
            aria-label="Météo"
        >
            <span class="weather-icon">☀️</span>
            <span class="weather-temp">--°C</span>
        </button>
        <button
            type="button"
            class="top-control top-control-pill rec-indicator"
            id="rec-status-widget"
            hidden
        >
            <span class="rec-dot-css"></span>
            <span class="rec-timer">REC</span>
        </button>
    </div>
    <div class="top-center-widgets">
        <button
            type="button"
            class="top-control top-control-pill"
            id="top-pill-lod"
            aria-live="polite"
            aria-label="Carte et zoom"
        >
            <span class="lod-badge">Carte · détail --</span>
        </button>
    </div>
    <div class="top-right-widgets">
        <button
            type="button"
            class="top-control top-control-icon"
            id="net-status-icon"
            aria-label="Statut réseau et données"
        >
            <svg
                width="18"
                height="18"
                viewBox="0 0 24 24"
                fill="none"
                stroke="var(--success)"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
            >
                <path d="M5 12.55a11 11 0 0 1 14.08 0" />
                <path d="M1.42 9a16 16 0 0 1 21.16 0" />
                <path d="M8.53 16.11a6 6 0 0 1 6.95 0" />
                <line x1="12" y1="20" x2="12.01" y2="20" />
            </svg>
        </button>
        <button
            type="button"
            class="top-control top-control-icon danger"
            id="sos-main-btn"
            aria-label="Appel de secours SOS"
        >
            <span class="sos-mark" aria-hidden="true">SOS</span>
        </button>
    </div>
</div>
<button
    type="button"
    class="top-control top-control-icon top-collapse-toggle"
    id="top-collapse-toggle"
    aria-label="Afficher/Masquer la barre supérieure"
    aria-controls="top-status-bar-content"
    aria-expanded="true"
>
    <svg
        width="12"
        height="12"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2.5"
        stroke-linecap="round"
        stroke-linejoin="round"
    >
        <polyline points="9 18 15 12 9 6" />
    </svg>
</button>
