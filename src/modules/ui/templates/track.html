<div id="track" class="bottom-sheet">
    <div class="sheet-drag-handle" aria-hidden="true">
        <div class="sheet-drag-indicator"></div>
    </div>
    <div class="sheet-header">
        <span class="sheet-title" data-i18n="track.title">Parcours</span>
        <div class="sheet-close" id="close-track">
            <svg
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
            >
                <line x1="18" y1="6" x2="6" y2="18" />
                <line x1="6" y1="6" x2="18" y2="18" />
            </svg>
        </div>
    </div>
    <div class="track-stats">
        <div class="stat-card">
            <div class="stat-card-label" data-i18n="track.stats.distance">
                Distance
            </div>
            <div class="stat-card-value" id="track-dist">
                0.0
                <span style="font-size: 13px; color: var(--text-2)">km</span>
            </div>
        </div>
        <div class="stat-card">
            <div class="stat-card-label" data-i18n="track.stats.points">
                Points
            </div>
            <div class="stat-card-value" id="track-points">0</div>
        </div>
        <div class="stat-card">
            <div class="stat-card-label" data-i18n="track.stats.dplus">
                Dénivelé +
            </div>
            <div class="stat-card-value green" id="track-dplus">
                +0 <span style="font-size: 12px">m</span>
            </div>
        </div>
        <div class="stat-card">
            <div class="stat-card-label" data-i18n="track.stats.dminus">
                Dénivelé −
            </div>
            <div class="stat-card-value red" id="track-dminus">
                −0 <span style="font-size: 12px">m</span>
            </div>
        </div>
        <div class="stat-card">
            <div class="stat-card-label" data-i18n="track.stats.duration">
                Temps estimé
            </div>
            <div class="stat-card-value" id="track-duration">—</div>
        </div>
    </div>
    <div class="track-actions">
        <button class="track-btn rec" id="rec-btn-sheet">
            <span class="trk-rec-icon rec-icon-idle">
                <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
                    <circle
                        cx="6"
                        cy="6"
                        r="5"
                        stroke="currentColor"
                        stroke-width="1.3"
                    />
                    <circle cx="6" cy="6" r="3" fill="currentColor" />
                </svg>
            </span>
            <span class="trk-rec-icon rec-icon-active">
                <svg width="10" height="10" viewBox="0 0 10 10" fill="none">
                    <rect
                        x="2"
                        y="2"
                        width="6"
                        height="6"
                        rx="1"
                        fill="white"
                    />
                </svg>
            </span>
            <span class="trk-rec-label" data-i18n="track.btn.rec">REC</span>
        </button>
        <button class="track-btn secondary" id="import-gpx-sheet">
            <svg
                width="14"
                height="14"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
            >
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                <polyline points="7 10 12 15 17 10" />
                <line x1="12" y1="15" x2="12" y2="3" />
            </svg>
            <span data-i18n="track.btn.import">Import GPX</span>
        </button>
        <input
            type="file"
            id="gpx-upload"
            accept=".gpx"
            style="display: none"
        />
    </div>
    <div id="rec-recording-upsell" class="rec-upsell-banner">
        <div
            style="
                display: flex;
                align-items: center;
                gap: 8px;
                font-weight: 700;
                color: var(--gold);
            "
        >
            <span>✨</span> <span>SunTrail PRO</span>
        </div>
        <p
            style="margin: 0; opacity: 0.9; font-size: 11px; line-height: 1.4"
            data-i18n="track.upsell.postRec"
        >
            Passez a Pro pour sauvegarder vos traces
        </p>
        <button
            class="btn-go"
            id="rec-upsell-btn"
            style="padding: 6px; font-size: 11px; margin-top: 4px; width: 100%"
            data-i18n="upgrade.trial.cta"
        >
            Essayer Pro Gratuitement
        </button>
    </div>
</div>
