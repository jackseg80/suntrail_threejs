<div id="packs" class="bottom-sheet">
    <div class="sheet-drag-handle" aria-hidden="true">
        <div class="sheet-drag-indicator"></div>
    </div>
    <div class="sheet-header">
        <span class="sheet-title" data-i18n="packs.title">Packs Pays</span>
        <button type="button" class="sheet-close" id="close-packs">
            <svg
                class="sheet-back-icon"
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
            >
                <path d="M19 12H5" />
                <path d="m12 19-7-7 7-7" />
            </svg>
            <svg
                class="sheet-close-icon"
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
            >
                <line x1="18" y1="6" x2="6" y2="18" />
                <line x1="6" y1="6" x2="18" y2="18" />
            </svg>
        </button>
    </div>

    <div id="packs-storage-info" class="stat-card packs-storage-card">
        <div class="stat-card-label" data-i18n="packs.storage">Stockage</div>
        <div class="stat-card-value" id="packs-storage-value">-- MB</div>
    </div>

    <div id="packs-list"></div>

    <div class="packs-lod-info" data-i18n="packs.lodInfo">
        Pro : plusieurs niveaux de détail &middot; Gratuit : détail standard
    </div>

    <button
        id="packs-restore-btn"
        type="button"
        class="packs-restore-btn"
        data-i18n="packs.btn.restore"
    >
        Restaurer les achats
    </button>
</div>
