<div id="solar-probe" class="bottom-sheet">
    <div class="sheet-drag-handle" aria-hidden="true">
        <div class="sheet-drag-indicator"></div>
    </div>
    <div class="sheet-header">
        <span class="sheet-title" data-i18n="solar.title">Analyse Solaire</span>
        <div class="sheet-close" id="close-probe">
            <svg
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
            >
                <line x1="18" y1="6" x2="6" y2="18" />
                <line x1="6" y1="6" x2="18" y2="18" />
            </svg>
        </div>
    </div>
    <div id="probe-content">
        <!-- Terrain warning -->
        <div
            id="probe-terrain-warn"
            class="exp-probe-warn"
            style="display: none"
        ></div>
        <!-- Location title -->
        <div
            id="solar-location-title"
            class="exp-location-title"
            style="display: none"
        ></div>
        <!-- Free upsell -->
        <div
            id="probe-free-upsell"
            class="exp-pro-upsell"
            style="display: none"
        ></div>
        <!-- Stats grid -->
        <div id="probe-stats-grid" class="exp-probe-grid"></div>
        <!-- Realtime section -->
        <div
            id="probe-realtime-section"
            class="exp-probe-realtime"
            style="display: none"
        ></div>
        <!-- Compass widget -->
        <div id="probe-compass-container"></div>
        <!-- Timeline section -->
        <div id="probe-timeline-section" style="display: none"></div>
        <!-- Segmented analysis -->
        <div id="probe-segmented-section" style="display: none"></div>
        <!-- Optimal departure -->
        <div id="probe-optimal-section" style="display: none"></div>
        <!-- Exposure list -->
        <div id="probe-exposure-section" style="display: none"></div>
        <!-- Route solar section -->
        <div id="probe-route-section" style="display: none"></div>
        <!-- Locked items placeholder -->
        <div id="probe-locked-items"></div>
    </div>
</div>
