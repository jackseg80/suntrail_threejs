<div id="solar-probe" class="bottom-sheet prepare-work-surface">
    <div class="sheet-drag-handle" aria-hidden="true">
        <div class="sheet-drag-indicator"></div>
    </div>
    <div class="sheet-header">
        <span class="sheet-title" data-i18n="solar.title">Analyse Solaire</span>
        <button type="button" class="sheet-close" id="close-probe">
            <svg
                class="solar-close-icon"
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
            >
                <line x1="18" y1="6" x2="6" y2="18" />
                <line x1="6" y1="6" x2="18" y2="18" />
            </svg>
            <svg
                class="solar-back-icon"
                width="18"
                height="18"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
            >
                <path d="m15 18-6-6 6-6" />
            </svg>
        </button>
    </div>
    <div id="probe-content">
        <!-- Terrain warning -->
        <div id="probe-terrain-warn" class="exp-probe-warn" hidden></div>
        <!-- Location title -->
        <div id="solar-location-title" class="exp-location-title" hidden></div>
        <!-- Free upsell -->
        <div id="probe-free-upsell" class="exp-pro-upsell" hidden></div>
        <!-- Stats grid -->
        <div id="probe-stats-grid" class="exp-probe-grid"></div>
        <!-- Realtime section -->
        <div
            id="probe-realtime-section"
            class="exp-probe-realtime"
            hidden
        ></div>
        <!-- Compass widget -->
        <div id="probe-compass-container"></div>
        <!-- Timeline section -->
        <div id="probe-timeline-section" hidden></div>
        <!-- Segmented analysis -->
        <div id="probe-segmented-section" hidden></div>
        <!-- Optimal departure -->
        <div id="probe-optimal-section" hidden></div>
        <!-- Exposure list -->
        <div id="probe-exposure-section" hidden></div>
        <!-- Route solar section -->
        <div id="probe-route-section" hidden></div>
        <!-- Locked items placeholder -->
        <div id="probe-locked-items"></div>
    </div>
</div>
