<div id="connectivity" class="bottom-sheet">
    <div class="sheet-drag-handle" aria-hidden="true">
        <div class="sheet-drag-indicator"></div>
    </div>
    <div class="sheet-header">
        <span class="sheet-title" data-i18n="connectivity.title"
            >Système & Données</span
        >
        <button type="button" class="sheet-close" id="close-connectivity">
            <svg
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
            >
                <line x1="18" y1="6" x2="6" y2="18" />
                <line x1="6" y1="6" x2="18" y2="18" />
            </svg>
        </button>
    </div>

    <div class="section-label" data-i18n="connectivity.section.signal">
        État du Signal
    </div>
    <div
        style="
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 20px;
        "
    >
        <div class="stat-card">
            <div
                class="stat-card-label"
                data-i18n="connectivity.label.gpsAccuracy"
            >
                Signal GPS
            </div>
            <div class="stat-card-value" id="gps-accuracy">
                -- <span style="font-size: 12px; color: var(--text-3)">m</span>
            </div>
        </div>
        <div class="stat-card">
            <div class="stat-card-label" data-i18n="connectivity.label.network">
                Réseau
            </div>
            <div class="stat-card-value" id="net-status">ONLINE</div>
            <div class="stat-card-sub" id="net-connection-type"></div>
        </div>
    </div>

    <div
        class="setting-row"
        style="
            margin-bottom: 20px;
            padding: 12px;
            background: rgba(59, 126, 248, 0.05);
            border-radius: 12px;
            border: 1px solid rgba(59, 126, 248, 0.1);
        "
    >
        <div style="display: flex; align-items: center; gap: 10px">
            <span style="font-size: 18px">✈️</span>
            <div>
                <div
                    class="setting-label"
                    style="font-size: 14px"
                    data-i18n="connectivity.label.offlineMode"
                >
                    Mode Hors-ligne
                </div>
                <div
                    style="font-size: 10px; color: var(--text-3)"
                    data-i18n="connectivity.label.offlineHint"
                >
                    Forcer l'usage du cache uniquement
                </div>
            </div>
        </div>
        <input
            type="checkbox"
            id="offline-toggle"
            aria-label="Mode Hors-ligne"
        />
    </div>

    <div class="control-group">
        <div
            class="section-label"
            data-i18n="connectivity.section.embeddedData"
        >
            Données embarquées
        </div>

        <!-- Pack status badge (contextuel, rempli dynamiquement) -->
        <div
            id="conn-pack-status"
            style="
                display: none;
                padding: var(--space-2) var(--space-3);
                margin-bottom: var(--space-2);
                background: rgba(59, 126, 248, 0.05);
                border-radius: var(--radius);
                border: 1px solid rgba(59, 126, 248, 0.1);
                font-size: var(--text-xs);
                color: var(--text-2);
            "
        ></div>

        <button
            id="conn-packs-btn"
            class="btn-go"
            style="
                margin: var(--space-2) 0;
                padding: var(--space-3);
                width: 100%;
                font-size: var(--text-sm);
                background: rgba(59, 126, 248, 0.1);
                color: var(--accent, #3b7ef8);
                border: 1px solid rgba(59, 126, 248, 0.2);
            "
            data-i18n="packs.title"
        >
            Packs Pays
        </button>

        <div style="display: flex; gap: 8px; margin-bottom: 15px">
            <button
                id="conn-download-zone"
                class="btn-go"
                style="margin: 0; padding: 12px; flex: 1; font-size: 12px"
            >
                <span data-i18n="connectivity.btn.downloadZone"
                    >Telecharger Zone</span
                >
            </button>
            <button
                id="conn-clear-cache"
                class="btn-go"
                style="
                    margin: 0;
                    padding: 12px;
                    background: #b91c1c;
                    flex: 1;
                    font-size: 12px;
                "
                data-i18n="connectivity.btn.clearCache"
            >
                Vider le Cache
            </button>
        </div>

        <div id="conn-cached-zones" class="cached-zones"></div>

        <div class="setting-row">
            <div class="setting-label" data-i18n="connectivity.label.pmtiles">
                Archive cartographique locale
            </div>
            <button
                id="conn-pmtiles-btn"
                class="icon-btn-sm"
                style="border: none; background: rgba(255, 255, 255, 0.05)"
            >
                📂
            </button>
            <input
                type="file"
                id="conn-pmtiles-upload"
                accept=".pmtiles"
                style="display: none"
            />
        </div>
    </div>
</div>
