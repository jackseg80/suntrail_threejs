<div id="connectivity" class="bottom-sheet">
    <div class="sheet-drag-handle" aria-hidden="true">
        <div class="sheet-drag-indicator"></div>
    </div>
    <div class="sheet-header">
        <span class="sheet-title" data-i18n="connectivity.title"
            >Connexion et cartes hors ligne</span
        >
        <button type="button" class="sheet-close" id="close-connectivity">
            <svg
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
            >
                <line x1="18" y1="6" x2="6" y2="18" />
                <line x1="6" y1="6" x2="18" y2="18" />
            </svg>
        </button>
    </div>

    <div class="section-label" data-i18n="connectivity.section.signal">
        État de la connexion
    </div>
    <div class="connectivity-status-grid">
        <div class="stat-card connectivity-stat-card">
            <div
                class="stat-card-label"
                data-i18n="connectivity.label.gpsAccuracy"
            >
                Signal GPS
            </div>
            <div class="stat-card-value" id="gps-accuracy">
                -- <span class="conn-unit">m</span>
            </div>
        </div>
        <div class="stat-card connectivity-stat-card">
            <div class="stat-card-label" data-i18n="connectivity.label.network">
                Réseau
            </div>
            <div class="stat-card-value" id="net-status">En ligne</div>
            <div class="stat-card-sub" id="net-connection-type"></div>
        </div>
    </div>

    <div class="setting-row connectivity-offline-row">
        <div class="connectivity-row-copy">
            <div
                class="setting-label"
                data-i18n="connectivity.label.offlineMode"
            >
                Mode hors ligne
            </div>
            <div
                class="connectivity-row-description"
                data-i18n="connectivity.label.offlineHint"
            >
                Utiliser uniquement les cartes déjà téléchargées
            </div>
        </div>
        <input
            type="checkbox"
            id="offline-toggle"
            aria-label="Mode hors ligne"
        />
    </div>

    <section
        class="control-group connectivity-data"
        aria-labelledby="connectivity-data-title"
    >
        <div
            id="connectivity-data-title"
            class="section-label"
            data-i18n="connectivity.section.embeddedData"
        >
            Cartes hors ligne
        </div>

        <div
            id="conn-pack-status"
            class="connectivity-pack-status"
            hidden
        ></div>

        <button id="conn-packs-btn" type="button" class="connectivity-link-row">
            <span data-i18n="packs.title">Packs pays</span>
            <svg
                width="18"
                height="18"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
            >
                <path d="m9 18 6-6-6-6" />
            </svg>
        </button>

        <div class="connectivity-zone-actions">
            <button
                id="conn-download-zone"
                type="button"
                class="connectivity-action connectivity-action--primary"
            >
                <span data-i18n="connectivity.btn.downloadZone"
                    >Télécharger une zone</span
                >
            </button>
            <button
                id="conn-clear-cache"
                type="button"
                class="connectivity-action connectivity-action--danger"
                data-i18n="connectivity.btn.clearCache"
            >
                Vider le cache
            </button>
        </div>

        <div id="conn-cached-zones" class="cached-zones"></div>

        <details class="connectivity-local-archive">
            <summary data-i18n="connectivity.label.pmtiles">
                Archive cartographique locale
            </summary>
            <p data-i18n="connectivity.label.pmtilesHint">
                Importer un fichier PMTiles depuis cet appareil.
            </p>
            <button
                id="conn-pmtiles-btn"
                type="button"
                class="connectivity-import-btn"
            >
                <svg
                    width="18"
                    height="18"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    aria-hidden="true"
                >
                    <path d="M3 7h5l2 2h11v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z" />
                    <path d="M12 12v5" />
                    <path d="m9.5 14.5 2.5-2.5 2.5 2.5" />
                </svg>
                <span data-i18n="connectivity.btn.importArchive"
                    >Importer un fichier</span
                >
            </button>
            <input
                type="file"
                id="conn-pmtiles-upload"
                accept=".pmtiles"
                hidden
            />
        </details>
    </section>
</div>
