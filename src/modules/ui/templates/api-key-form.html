<div class="api-key-section">
    <p class="section-label" data-i18n="apiKey.label">Clé MapTiler</p>
    <form class="api-key-form">
        <div class="api-key-input-row">
            <input
                type="text"
                class="api-key-input"
                placeholder="Coller votre clé ici..."
                data-i18n-placeholder="apiKey.placeholder"
                autocomplete="off"
                spellcheck="false"
            />
            <button type="submit" class="api-key-submit-btn">
                <svg
                    width="14"
                    height="14"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="3"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    aria-hidden="true"
                >
                    <polyline points="20 6 9 17 4 12" />
                </svg>
            </button>
        </div>
    </form>
    <p class="api-key-hint">
        <a
            href="https://cloud.maptiler.com/account/keys/"
            target="_blank"
            rel="noopener noreferrer"
            data-i18n="apiKey.link"
            >Obtenir une clé gratuite ↗</a
        >
    </p>
</div>
