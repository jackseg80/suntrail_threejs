<div id="layers-sheet" class="bottom-sheet">
    <div class="sheet-drag-handle" aria-hidden="true">
        <div class="sheet-drag-indicator"></div>
    </div>
    <div class="sheet-header">
        <span
            id="layers-sheet-title"
            class="sheet-title"
            data-i18n="layers.title"
            >Fonds de carte</span
        >
        <button type="button" class="sheet-close" id="close-layers">
            <svg
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
            >
                <line x1="18" y1="6" x2="6" y2="18" />
                <line x1="6" y1="6" x2="18" y2="18" />
            </svg>
        </button>
    </div>

    <div class="layer-grid" role="listbox" aria-labelledby="layers-sheet-title">
        <div
            class="layer-item active"
            data-source="swisstopo"
            role="option"
            tabindex="0"
            aria-selected="true"
        >
            <div class="layer-thumb"></div>
            <div class="layer-name" data-i18n="layers.source.swisstopo">
                Topo (Auto)
            </div>
        </div>
        <div
            class="layer-item"
            data-source="satellite"
            role="option"
            tabindex="0"
            aria-selected="false"
        >
            <div class="layer-thumb">
                <div class="layer-pro-badge" aria-hidden="true">Pro</div>
            </div>
            <div class="layer-name" data-i18n="layers.source.satellite">
                Satellite
            </div>
        </div>
        <div
            class="layer-item"
            data-source="opentopomap"
            role="option"
            tabindex="0"
            aria-selected="false"
        >
            <div class="layer-thumb"></div>
            <div class="layer-name" data-i18n="layers.source.topo">
                OpenTopo
            </div>
        </div>
    </div>

    <div class="settings-section layers-overlays">
        <div class="setting-row layers-overlay-row" id="row-trails">
            <div class="layers-overlay-label">
                <div class="setting-icon setting-icon--trails">
                    <svg
                        width="14"
                        height="14"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2.5"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    >
                        <path
                            d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"
                        ></path>
                    </svg>
                </div>
                <div>
                    <div
                        class="setting-label"
                        data-i18n="layers.overlay.trails"
                    >
                        Sentiers
                    </div>
                    <div
                        class="lod-warning"
                        hidden
                        data-i18n="layers.overlay.trailsUnavailable"
                    >
                        Indisponible à ce zoom
                    </div>
                </div>
            </div>
            <div class="layers-overlay-control">
                <input
                    type="checkbox"
                    id="layers-trails-toggle"
                    aria-label="Sentiers"
                />
            </div>
        </div>
        <div class="setting-row layers-overlay-row" id="row-slopes">
            <div class="layers-overlay-label">
                <div class="setting-icon setting-icon--slopes">
                    <svg
                        width="14"
                        height="14"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2.5"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    >
                        <path d="M12 3l8 15H4l8-15z" />
                    </svg>
                </div>
                <div>
                    <div
                        class="setting-label"
                        data-i18n="layers.overlay.slopes"
                    >
                        Pentes > 30°
                    </div>
                    <div
                        class="lod-warning"
                        hidden
                        data-i18n="layers.overlay.slopesUnavailable"
                    >
                        Indisponible à ce zoom
                    </div>
                </div>
            </div>
            <div class="layers-overlay-control">
                <input
                    type="checkbox"
                    id="layers-slopes-toggle"
                    aria-label="Pentes > 30°"
                />
            </div>
        </div>
    </div>
</div>
