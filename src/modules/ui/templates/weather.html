<div id="weather" class="bottom-sheet">
    <div class="sheet-drag-handle" aria-hidden="true">
        <div class="sheet-drag-indicator"></div>
    </div>
    <div class="sheet-header">
        <span class="sheet-title" data-i18n="weather.title"
            >Bulletin Météo</span
        >
        <span class="sheet-header-actions">
            <button
                id="weather-refresh-btn"
                class="btn-icon-mini"
                title="Rafraîchir la météo"
                aria-label="Rafraîchir la météo"
            >
                <svg
                    width="14"
                    height="14"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2.5"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                >
                    <polyline points="1 4 1 10 7 10" />
                    <path d="M4 17a9 9 0 0 0 15-4" />
                    <polyline points="23 20 23 14 17 14" />
                    <path d="M20 7a9 9 0 0 0-15 4" />
                </svg>
            </button>
            <div class="sheet-close" id="close-weather">
                <svg
                    width="16"
                    height="16"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    aria-hidden="true"
                >
                    <line x1="18" y1="6" x2="6" y2="18" />
                    <line x1="6" y1="6" x2="18" y2="18" />
                </svg>
            </div>
        </span>
    </div>
    <div id="weather-content"></div>
</div>
