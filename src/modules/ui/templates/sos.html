<div id="sos" class="bottom-sheet">
    <div class="sheet-drag-handle" aria-hidden="true">
        <div class="sheet-drag-indicator"></div>
    </div>
    <div class="sheet-header">
        <span class="sheet-title" data-i18n="sos.title">Urgence SOS</span>
        <button type="button" class="sheet-close" id="sos-header-close-btn">
            <svg
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
            >
                <line x1="18" y1="6" x2="6" y2="18" />
                <line x1="6" y1="6" x2="18" y2="18" />
            </svg>
        </button>
    </div>
    <div class="sos-content">
        <div class="sos-hero-mark" aria-hidden="true">SOS</div>
        <p class="sos-subtitle" data-i18n="sos.subtitle">
            Voici vos coordonnées exactes à transmettre aux secours.
        </p>
        <div id="sos-text-container" class="sos-message">
            <span data-i18n="sos.locating">Localisation en cours...</span>
        </div>
        <div class="sos-actions">
            <button
                type="button"
                id="sos-copy-btn"
                class="track-btn primary"
                data-i18n="sos.copy"
            >
                Copier
            </button>
            <button
                type="button"
                id="sos-sms-btn"
                class="track-btn primary sos-sms-btn"
                disabled
                data-i18n="sos.sms"
            >
                SMS
            </button>
        </div>
    </div>
</div>
