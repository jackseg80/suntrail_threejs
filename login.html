<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SunTrail 3D — Connexion</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap">
    <style>
        :root {
            --bg: #0a0c10;
            --surface: #12141c;
            --accent: #f97316;
            --text: #f8fafc;
            --text-dim: #94a3b8;
        }
        body {
            margin: 0;
            font-family: 'DM Sans', sans-serif;
            background: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .auth-container {
            background: var(--surface);
            padding: 40px;
            border-radius: 24px;
            width: 100%;
            max-width: 400px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        h1 { margin-top: 0; font-size: 1.5rem; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; color: var(--text-dim); font-size: 0.9rem; }
        input {
            width: 100%;
            padding: 12px;
            background: #1e293b;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: #fff;
            box-sizing: border-box;
        }
        .btn {
            width: 100%;
            padding: 14px;
            border-radius: 8px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 15px;
            transition: all 0.2s;
        }
        .btn-primary { background: var(--accent); color: #fff; }
        .btn-primary:hover { opacity: 0.9; }
        .btn-link { background: none; color: var(--text-dim); font-size: 0.9rem; }
        .error-msg { color: #ef4444; font-size: 0.85rem; margin-bottom: 15px; display: none; }
    </style>
</head>
<body>
    <div class="auth-container">
        <h1 id="auth-title">Connexion à SunTrail</h1>
        <div id="error-box" class="error-msg"></div>
        <form id="auth-form">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" required placeholder="votre@email.com">
            </div>
            <div class="form-group">
                <label for="password">Mot de passe</label>
                <input type="password" id="password" required placeholder="••••••••">
            </div>
            <button type="submit" class="btn btn-primary" id="submit-btn">Se connecter</button>
            <button type="button" class="btn btn-link" id="toggle-auth">Pas encore de compte ? S'inscrire</button>
        </form>
    </div>

    <script type="module">
        import { authService } from './src/modules/authService';
        
        const form = document.getElementById('auth-form');
        const emailInput = document.getElementById('email');
        const passInput = document.getElementById('password');
        const errorBox = document.getElementById('error-box');
        const submitBtn = document.getElementById('submit-btn');
        const toggleBtn = document.getElementById('toggle-auth');
        const title = document.getElementById('auth-title');

        let isSignUp = false;

        toggleBtn.onclick = () => {
            isSignUp = !isSignUp;
            title.innerText = isSignUp ? "Créer un compte SunTrail" : "Connexion à SunTrail";
            submitBtn.innerText = isSignUp ? "S'inscrire" : "Se connecter";
            toggleBtn.innerText = isSignUp ? "Déjà un compte ? Se connecter" : "Pas encore de compte ? S'inscrire";
        };

        form.onsubmit = async (e) => {
            e.preventDefault();
            errorBox.style.display = 'none';
            submitBtn.disabled = true;
            submitBtn.innerText = "Chargement...";

            try {
                if (isSignUp) {
                    await authService.signUp(emailInput.value, passInput.value);
                    alert("Compte créé ! Vérifiez vos emails pour confirmer.");
                } else {
                    await authService.signIn(emailInput.value, passInput.value);
                    // Succès : Redirection vers l'app
                    const isProd = window.location.hostname !== 'localhost';
                    const base = isProd ? '/suntrail_threejs/' : '/';
                    window.location.href = base + 'app.html';
                }
            } catch (err) {
                errorBox.innerText = err.message;
                errorBox.style.display = 'block';
                submitBtn.disabled = false;
                submitBtn.innerText = isSignUp ? "S'inscrire" : "Se connecter";
            }
        };
    </script>
</body>
</html>
