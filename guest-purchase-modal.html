<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SunTrail 3D — Mode Invité</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap">
    <style>
        :root {
            --bg: #030712;
            --surface: #111827;
            --accent: #f97316;
            --text: #f9fafb;
            --text-dim: #9ca3af;
        }
        body { margin: 0; font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); display: flex; justify-content: center; align-items: center; height: 100vh; padding: 20px; }
        .modal { background: var(--surface); padding: 40px; border-radius: 24px; width: 100%; max-width: 450px; border: 1px solid rgba(255, 255, 255, 0.1); text-align: center; }
        h1 { font-size: 1.5rem; margin-bottom: 20px; }
        p { color: var(--text-dim); margin-bottom: 30px; }
        .btn-group { display: flex; flex-direction: column; gap: 12px; }
        .btn { padding: 14px; border-radius: 12px; border: none; font-weight: 600; cursor: pointer; transition: 0.2s; }
        .btn-primary { background: var(--accent); color: #fff; }
        .btn-secondary { background: rgba(255, 255, 255, 0.1); color: #fff; }
        .btn-link { background: none; color: var(--text-dim); margin-top: 10px; }
    </style>
</head>
<body>
    <div class="modal">
        <h1>Paiement en Mode Invité</h1>
        <p>Cet achat sera lié uniquement à ce navigateur. Si vous changez d'appareil ou videz votre cache, vous perdrez l'accès Pro associé à cet achat.</p>
        <div class="btn-group">
            <button id="btn-continue" class="btn btn-primary">Continuer en mode invité</button>
            <button id="btn-login" class="btn btn-secondary">Se connecter / S'inscrire</button>
            <button id="btn-cancel" class="btn btn-link">Annuler</button>
        </div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        
        document.getElementById('btn-continue').onclick = () => {
            window.opener.postMessage({ type: 'PURCHASE_GUEST_CONTINUE' }, '*');
            window.close();
        };

        document.getElementById('btn-login').onclick = () => {
            window.location.href = './login.html';
        };

        document.getElementById('btn-cancel').onclick = () => {
            window.close();
        };
    </script>
</body>
</html>
